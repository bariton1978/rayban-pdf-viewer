<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>RB PDF - Ray-Ban Display</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}
.logo{font-weight:800;letter-spacing:-0.5px}
.badge{background:#111;border:1px solid #333;border-radius:20px;padding:4px 10px;font-size:11px;color:#888}
.container{max-width:800px;margin:0 auto;padding:16px}
.drop{border:2px dashed #333;border-radius:20px;padding:32px 20px;text-align:center;background:#0a0a0a;margin-bottom:16px}
.drop.active{border-color:#ff3b30;background:#111}
input[type=file]{display:block;width:100%;margin:16px 0;padding:16px;background:#111;border:1px solid #333;border-radius:12px;color:#fff;font-size:16px}
.btn{width:100%;height:52px;border-radius:14px;border:0;background:#ff3b30;color:#fff;font-weight:700;font-size:16px;margin-top:12px}
.btn2{background:#1a1a1a;border:1px solid #333;color:#fff}
.canvas-wrap{background:#0a0a0a;border-radius:16px;padding:12px;border:1px solid #222;margin-top:16px;overflow:auto;text-align:center}
canvas{max-width:100%;height:auto;background:#fff;border-radius:8px}
.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.controls button{flex:1;min-width:80px;height:44px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:13px}
.info{font-size:13px;color:#888;margin-top:8px;line-height:1.5}
.page-info{font-size:18px;font-weight:800;text-align:center;margin:12px 0}
.hidden{display:none}
#log{white-space:pre-wrap;font-size:11px;color:#666;margin-top:12px;background:#0a0a0a;padding:8px;border-radius:8px;border:1px solid #111;max-height:120px;overflow:auto}
</style>
<script type="text/javascript" nonce="39bda58a831342ea90d3e274cae" src="//local.adguard.org?ts=1788963501952&amp;type=content-script&amp;dmn=1330980966763907.a.metaaiusercontent.com&amp;url=https%3A%2F%2F1330980966763907.a.metaaiusercontent.com%2Fhtml%3Fartifact_uuid%3D4d280b9b-5622-4d28-b3b4-2728a7b63cf7%26download%3DFinal-Native-Pdf-Viewer.html%26ext%3D1789048800%26hash%3DQ5fpDAF5lXkAiMUGgQ85O9JbkAg0&amp;app=chrome.exe&amp;css=3&amp;js=1&amp;rel=1&amp;rji=1&amp;sbe=1"></script><script type="text/javascript" nonce="39bda58a831342ea90d3e274cae" src="//local.adguard.org?ts=1788963501952&amp;name=AdGuard%20Extra&amp;name=AdGuard%20Popup%20Blocker&amp;type=user-script"></script></head>
<body>
<div class="header">
  <div class="logo">RB PDF • Ray-Ban Display</div>
  <div class="badge" id="modeBadge">PHONE MODE</div>
</div>
<div class="container">
  <div class="drop" id="drop">
    <div style="font-size:40px;margin-bottom:12px">📄</div>
    <div style="font-weight:700;margin-bottom:6px">PDF를 선택하세요</div>
    <div style="font-size:13px;color:#666">폰 저장소 / 구글 드라이브 / 카톡에서 받은 파일</div>
    <input type="file" id="fileInput" accept="application/pdf,.pdf" />
    <div class="info">파일 선택이 안되면 아래 버튼을 길게 눌러보세요. iPhone은 파일 앱에서 PDF를 선택하세요.</div>
    <div id="log">대기 중...</div>
  </div>

  <div id="viewer" class="hidden">
    <div class="page-info"><span id="pageNum">1</span> / <span id="totalPages">0</span> • <span id="fileName"></span></div>
    <div class="canvas-wrap">
      <canvas id="pdfCanvas"></canvas>
    </div>
    <div class="controls">
      <button id="prevBtn">◀ 이전</button>
      <button id="nextBtn">다음 ▶</button>
      <button id="zoomOutBtn">-</button>
      <button id="zoomInBtn">+</button>
      <button id="clearBtn" style="background:#222">닫기</button>
    </div>
    <div class="info" style="margin-top:12px">
      • 안경에서는 폰에서 저장한 PDF가 자동 로드됩니다<br>
      • 같은 주소 <b>bariton1978.github.io/rayban-pdf-viewer</b> 에서 폰이랑 안경이 저장소를 공유합니다<br>
      • 밝기 110% + 고대비 모드가 야외에서 제일 잘 보입니다
    </div>
  </div>
</div>

<script>
const logEl = document.getElementById('log');
function log(msg){ logEl.textContent = new Date().toLocaleTimeString() + ' - ' + msg + '\n' + logEl.textContent; console.log(msg); }

let pdfDoc = null;
let pageNum = 1;
let zoom = 1.3;
let pdfBytes = null;

const fileInput = document.getElementById('fileInput');
const drop = document.getElementById('drop');
const viewer = document.getElementById('viewer');
const canvas = document.getElementById('pdfCanvas');
const ctx = canvas.getContext('2d');
const modeBadge = document.getElementById('modeBadge');

if(window.innerWidth < 700){ modeBadge.textContent = 'GLASSES MODE - 600px'; }

function saveToDB(buffer, name){
  try{
    localStorage.setItem('rb_pdf_name', name);
    localStorage.setItem('rb_pdf_size', String(buffer.byteLength));
    const req = indexedDB.open('rb-pdf-db', 1);
    req.onupgradeneeded = (e)=>{ const db=e.target.result; if(!db.objectStoreNames.contains('pdfs')) db.createObjectStore('pdfs'); };
    req.onsuccess = (e)=>{
      const db=e.target.result;
      const tx=db.transaction('pdfs','readwrite');
      tx.objectStore('pdfs').put(buffer, 'current');
      tx.oncomplete = ()=>{ log('IndexedDB 저장 완료: '+name+' ('+buffer.byteLength+' bytes)'); };
    };
    req.onerror = ()=>{ log('IndexedDB 저장 실패'); };
  }catch(err){ log('저장 오류: '+err.message); }
}

function loadFromDB(callback){
  try{
    const req = indexedDB.open('rb-pdf-db', 1);
    req.onupgradeneeded = (e)=>{ const db=e.target.result; if(!db.objectStoreNames.contains('pdfs')) db.createObjectStore('pdfs'); };
    req.onsuccess = (e)=>{
      const db=e.target.result;
      const tx=db.transaction('pdfs','readonly');
      const get=tx.objectStore('pdfs').get('current');
      get.onsuccess = ()=>{
        if(get.result){ log('IndexedDB에서 PDF 발견: '+get.result.byteLength+' bytes'); callback(get.result); }
        else{ log('IndexedDB에 저장된 PDF 없음'); callback(null); }
      };
    };
    req.onerror = ()=>callback(null);
  }catch(err){ callback(null); }
}

async function loadPdfJs(){
  if(window.pdfjsLib) return window.pdfjsLib;
  log('PDF.js 로딩 중...');
  return new Promise((resolve, reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload=()=>{
      const lib=window.pdfjsLib;
      lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      log('PDF.js 로드 완료');
      resolve(lib);
    };
    s.onerror=()=>{ log('PDF.js 로드 실패 - 네트워크 확인'); reject(new Error('PDF.js load failed')); };
    document.head.appendChild(s);
  });
}

async function renderPage(num){
  if(!pdfDoc) return;
  try{
    const page = await pdfDoc.getPage(num);
    const viewport = page.getViewport({scale: zoom});
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    const renderCtx = {canvasContext: ctx, viewport: viewport};
    await page.render(renderCtx).promise;
    document.getElementById('pageNum').textContent = num;
    log('페이지 '+num+' 렌더링 완료');
  }catch(err){ log('렌더 오류: '+err.message); }
}

async function openPdfFromBuffer(buffer, name){
  try{
    const lib = await loadPdfJs();
    const loadingTask = lib.getDocument({data: buffer});
    pdfDoc = await loadingTask.promise;
    document.getElementById('totalPages').textContent = pdfDoc.numPages;
    document.getElementById('fileName').textContent = name || localStorage.getItem('rb_pdf_name') || '저장된 PDF';
    pageNum = 1;
    drop.classList.add('hidden');
    viewer.classList.remove('hidden');
    await renderPage(pageNum);
    log('PDF 열기 성공: '+pdfDoc.numPages+'페이지');
  }catch(err){
    log('PDF 열기 실패: '+err.message);
    alert('PDF를 열 수 없습니다: '+err.message);
  }
}

fileInput.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file){ log('파일 선택 취소됨'); return; }
  log('파일 선택됨: '+file.name+' ('+file.size+' bytes)');
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
    alert('PDF 파일만 선택 가능합니다');
    return;
  }
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    const buffer = ev.target.result;
    pdfBytes = buffer;
    saveToDB(buffer, file.name);
    await openPdfFromBuffer(buffer, file.name);
  };
  reader.onerror = ()=>{ log('파일 읽기 실패'); alert('파일을 읽을 수 없습니다'); };
  reader.readAsArrayBuffer(file);
});

drop.addEventListener('dragover', (e)=>{ e.preventDefault(); drop.classList.add('active'); });
drop.addEventListener('dragleave', ()=>drop.classList.remove('active'));
drop.addEventListener('drop', (e)=>{
  e.preventDefault(); drop.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if(file){ fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change', {bubbles:true})); }
});

document.getElementById('prevBtn').onclick = async ()=>{ if(pageNum>1){ pageNum--; await renderPage(pageNum); } };
document.getElementById('nextBtn').onclick = async ()=>{ if(pdfDoc && pageNum<pdfDoc.numPages){ pageNum++; await renderPage(pageNum); } };
document.getElementById('zoomInBtn').onclick = async ()=>{ zoom=Math.min(3, zoom+0.2); await renderPage(pageNum); };
document.getElementById('zoomOutBtn').onclick = async ()=>{ zoom=Math.max(0.5, zoom-0.2); await renderPage(pageNum); };
document.getElementById('clearBtn').onclick = ()=>{
  const req=indexedDB.open('rb-pdf-db',1);
  req.onsuccess=(e)=>{ const db=e.target.result; const tx=db.transaction('pdfs','readwrite'); tx.objectStore('pdfs').delete('current'); };
  localStorage.removeItem('rb_pdf_name');
  pdfDoc=null; viewer.classList.add('hidden'); drop.classList.remove('hidden'); fileInput.value=''; log('저장된 PDF 삭제됨');
};

window.addEventListener('load', ()=>{
  log('페이지 로드 완료, 저장된 PDF 확인 중...');
  loadFromDB((buffer)=>{
    if(buffer){
      log('자동 로드 시도');
      openPdfFromBuffer(buffer, localStorage.getItem('rb_pdf_name')||'저장된 PDF');
    }else{
      log('저장된 PDF 없음 - 새로 선택 필요');
    }
  });
});
</script>
</body>
</html>
